services:
  - type: web
    name: smart-agriculture-management
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm --prefix "Back end" ci --omit=dev && node -e "require('fs').cpSync('public', 'Back end/public', { recursive: true })"
    startCommand: npm --prefix "Back end" start
    disk:
      name: smart-agriculture-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
