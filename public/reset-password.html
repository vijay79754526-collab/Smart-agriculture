<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Smart Agriculture</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }.container {
  background: white;
  padding: 30px;
  border-radius: 12px;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 4px 15px #0002;
}

h2 {
  text-align: center;
  color: #267a35;
}

input, button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  box-sizing: border-box;
  border-radius: 6px;
  font-size: 16px;
}

input {
  border: 1px solid #ccc;
}

button {
  background: #267a35;
  color: white;
  border: none;
  cursor: pointer;
}

#message {
  text-align: center;
  margin-top: 15px;
}

  </style>
</head>
<body><div class="container">
  <h2>Reset Your Password</h2>
  <p>Reset links expire after 60 minutes and can only be used once.</p>
  <form id="resetForm">
    <input
      type="password"
      id="newPassword"
      placeholder="Enter new password"
      minlength="8"
      required
    ><input
  type="password"
  id="confirmPassword"
  placeholder="Confirm new password"
  minlength="8"
  required
>

<button type="submit">Update Password</button>

  </form>  <p id="message"></p>
  <p><a href="/login">Back to login</a></p>
</div><script>
  const params = new URLSearchParams(window.location.search);
  const resetId = params.get("resetId");
  const token = params.get("token");

  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const button = form.querySelector("button");

  if (!resetId || !token) {
    form.hidden = true;
    message.textContent = "Invalid or missing reset link. Request a new one.";
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
      message.textContent = "Password must contain at least 8 characters.";
      return;
    }

    if (newPassword !== confirmPassword) {
      message.textContent = "Passwords do not match.";
      return;
    }

    button.disabled = true;
    message.textContent = "Updating password...";

    try {
      const response = await fetch("/api/password-reset/complete", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          resetId,
          token,
          newPassword,
          confirmPassword
        })
      });

      const data = await response.json();

      if (!response.ok) {
        if (response.status === 400 && /invalid or expired/i.test(data.error || "")) {
          form.hidden = true;
          message.textContent = "This link has expired or was already used. If you already changed your password, go to login and use your new password. Otherwise, request a new reset link.";
          return;
        }
        throw new Error(data.error || "Password reset failed.");
      }

      message.textContent = "Password changed successfully. Taking you to login...";
      if (data.loginIdentifier) {
        sessionStorage.setItem("password-reset-login-identifier", data.loginIdentifier);
      }

      form.reset();
      form.hidden = true;

      setTimeout(() => {
        window.location.assign("/login?reset=success");
      }, 1000);

    } catch (error) {
      message.textContent = error.message;
      button.disabled = false;
    }
  });
</script>
</body>
</html>
