<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop History · Smart Agriculture</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-icon">🌱</div>
      <h1>Smart Agriculture</h1>
    </div>
    <nav class="header-actions" aria-label="Main navigation">
      <a class="header-nav-link" href="/dashboard">Dashboard</a>
      <a class="header-nav-link" href="/manage-crops">Manage Crops</a>
    </nav>
  </header>
  <main class="recommendation-page">
    <div class="dashboard-header">
      <div>
        <p class="eyebrow">Farm records</p>
        <h2>Crop History</h2>
      </div>
      <p class="subheading">Review previous and current crop details. Latest changes appear first.</p>
    </div>
    <section id="cropHistoryList" class="crop-history-list" aria-live="polite">
      <p>Loading crop history…</p>
    </section>
    <p id="historyMessage" class="form-message form-message-error" role="status" aria-live="polite"></p>
  </main>
  <footer class="site-footer">
    <img src="/images/agriculture-footer.svg" alt="" aria-hidden="true">
    <span>Smart Agriculture</span>
  </footer>
  <script src="/crop-history.js"></script>
</body>
</html>
