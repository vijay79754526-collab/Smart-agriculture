<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop recommendations · Smart Agriculture</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-icon">🌱</div>
      <h1>Smart Agriculture</h1>
    </div>
    <nav class="header-actions" aria-label="Main navigation">
      <a class="header-nav-link" href="/dashboard">Dashboard</a>
      <a class="header-nav-link" href="/feature/saved-searches">History</a>
    </nav>
  </header>
  <main class="recommendation-page">
    <div class="dashboard-header">
      <div>
        <p class="eyebrow">Crop planning results</p>
        <h2>Suitable crop recommendations</h2>
      </div>
      <a class="primary-link" href="/recommendation-form">Start a new crop check</a>
    </div>
    <section id="recommendationResults" class="recommendation-results" aria-live="polite">
      <p>Loading your saved recommendations…</p>
    </section>
    <p id="resultsMessage" class="form-message form-message-error" role="status" aria-live="polite"></p>
  </main>
  <footer class="site-footer">
    <img src="/images/agriculture-footer.svg" alt="" aria-hidden="true">
    <span>Smart Agriculture</span>
  </footer>
  <script src="/recommendation-results.js"></script>
</body>
</html>
